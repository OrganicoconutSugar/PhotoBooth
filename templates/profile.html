{% extends "base.html" %}

{% block content %}
<div class="min-h-screen pt-32 pb-16 px-4 relative z-10 select-none transition-colors duration-300">
    <div class="max-w-2xl mx-auto">

        <!-- Profile Header Card -->
        <div class="bg-white border border-zinc-200/80 p-8 rounded-[32px] shadow-xl profile-card relative overflow-hidden">
            <!-- Decorative Background Element -->
            <div class="absolute top-0 right-0 w-32 h-32 bg-zinc-100 rounded-full -mr-16 -mt-16 blur-3xl opacity-50"></div>

            <div class="text-center mb-10 relative z-10">
                <!-- Profile Image Section -->
                <div class="relative w-32 h-32 mx-auto mb-6 group">
                    <div class="w-full h-full rounded-full overflow-hidden border-4 border-white shadow-lg ring-1 ring-zinc-200 group-hover:ring-zinc-400 transition-all duration-300 bg-zinc-100">
                        {% if current_user.profile_pic %}
                            <img src="{{ url_for('static', filename='uploads/' + current_user.profile_pic) }}?v={{ current_user.profile_pic }}"
                                 alt="{{ current_user.username }}"
                                 class="w-full h-full object-cover block"
                                 onerror="this.src='https://via.placeholder.com/150';">
                        {% else %}
                            <div class="w-full h-full flex items-center justify-center text-4xl text-zinc-400">
                                👤
                            </div>
                        {% endif %}
                    </div>

                    <!-- Upload Overlay - Linked to hidden input via 'for' -->
                    <label for="profile-pic-input" class="absolute inset-0 bg-zinc-900/60 backdrop-blur-sm rounded-full flex flex-col items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-all duration-300 cursor-pointer">
                        <span class="text-xl">📸</span>
                        <span class="text-[9px] font-black uppercase tracking-tighter mt-1">Update</span>
                    </label>
                </div>

                <h1 class="text-2xl font-black tracking-widest uppercase text-zinc-900 font-sans">Studio Member</h1>
                <p class="text-zinc-400 text-[10px] font-bold uppercase tracking-widest mt-1">Identity Management</p>
            </div>

            <!-- Form Profile -->
            <form id="profile-form" method="POST" action="/profile" enctype="multipart/form-data" class="space-y-6 relative z-10">
                <!-- Hidden File Input -->
                <input type="file" name="profile_pic" id="profile-pic-input" class="hidden" onchange="this.form.submit()">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-[10px] font-black tracking-[0.2em] uppercase text-zinc-400 ml-1">
                            Username
                        </label>
                        <input type="text" name="username" value="{{ current_user.username }}" required
                            class="w-full bg-zinc-50 border border-zinc-200 focus:border-zinc-900 rounded-2xl px-4 py-3 text-sm focus:outline-none transition-all text-zinc-900 font-medium shadow-sm">
                    </div>

                    <div class="space-y-2">
                        <label class="block text-[10px] font-black tracking-[0.2em] uppercase text-zinc-400 ml-1">
                            Phone Number
                        </label>
                        <input type="tel" name="phone" value="{{ current_user.phone if current_user.phone else '' }}"
                            placeholder="0812..."
                            class="w-full bg-zinc-50 border border-zinc-200 focus:border-zinc-900 rounded-2xl px-4 py-3 text-sm focus:outline-none transition-all text-zinc-900 font-medium shadow-sm">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black tracking-[0.2em] uppercase text-zinc-400 ml-1">
                        Bio / Description
                    </label>
                    <textarea name="bio" rows="3" placeholder="Tell us about yourself..."
                        class="w-full bg-zinc-50 border border-zinc-200 focus:border-zinc-900 rounded-2xl px-4 py-3 text-sm focus:outline-none transition-all text-zinc-900 font-medium resize-none shadow-sm">{{ current_user.bio if current_user.bio else '' }}</textarea>
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black tracking-[0.2em] uppercase text-zinc-400 ml-1">
                        Email Address
                    </label>
                    <div class="w-full bg-zinc-100 border border-zinc-200 rounded-2xl px-4 py-3 text-sm cursor-not-allowed opacity-60 text-zinc-500 font-medium flex items-center">
                        {{ current_user.email }}
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex flex-col gap-3 pt-6">
                    <button type="submit"
                        class="w-full bg-zinc-900 text-white font-black text-xs tracking-widest uppercase py-4 rounded-2xl shadow-lg hover:bg-zinc-800 transition-all transform active:scale-[0.98] cursor-pointer">
                        Save Profile Changes
                    </button>

                    <a href="{{ url_for('auth.logout') }}"
                       class="w-full text-center text-red-500 hover:text-red-600 font-black text-[10px] tracking-widest uppercase py-3 transition-all cursor-pointer hover:underline">
                        Logout from Account
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="{{ url_for('static', filename='js/profile.js') }}" defer></script>

{% endblock %}

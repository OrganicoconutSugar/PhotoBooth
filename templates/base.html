<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>

</head>

{# Add `hero-bg` class to enable photographic background. If you prefer to disable later,
   remove `hero-bg` from the body class or delete the `style` attribute below. #}
<body class="min-h-screen flex flex-col overflow-x-hidden hero-bg" style="background-image: url('{{ url_for('static', filename='assets/Photobooth_Background.jpeg') }}');">

    <nav
        class="global-glass fixed top-4 left-1/2 -translate-x-1/2 w-[92%] md:w-[60%] z-50 px-6 md:px-8 py-3 flex justify-between items-center border border-black/10 dark:border-white/10 shadow-2xl rounded-full backdrop-blur-md transition-all duration-300 text-slate-900 dark:text-white">

        <a href="{{ url_for('user.dashboard') }}"
            class="font-black tracking-widest text-[10px] md:text-xs uppercase flex items-center gap-2 select-none">
            <span class="w-2 h-2 bg-black dark:bg-white rounded-full animate-pulse"></span>
            Aesthetic Studio
        </a>

        <div class="hidden md:flex items-center gap-8 text-[10px] font-black tracking-widest uppercase">
            <a href="{{ url_for('user.dashboard') }}" class="hover:opacity-50 transition-opacity py-1">About Us</a>
            <a href="{{ url_for('photo.photobooth') }}" class="hover:opacity-50 transition-opacity py-1">📸 Photobooth</a>
            <a href="{{ url_for('user.gallery') }}" class="hover:opacity-50 transition-opacity py-1">🖼️ Gallery</a>
        </div>

        <div class="flex items-center">
            <a href="{{ url_for('user.profile') }}"
                class="w-8 h-8 rounded-full bg-white text-slate-900 flex items-center justify-center border border-black/15 hover:scale-110 active:scale-95 hover:rotate-6 transition-all shadow-md group overflow-hidden"
                title="Buka Profil Saya">
                <span class="text-xs group-hover:scale-110 transition-transform">👤</span>
            </a>
            <!-- background applied globally via base template -->
        </div>

    </nav>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>

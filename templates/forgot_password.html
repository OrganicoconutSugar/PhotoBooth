{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto py-24 px-4 relative z-10 select-none">
    <div class="global-glass p-8 rounded-2xl shadow-2xl form-card">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black tracking-wider uppercase">Reset Password</h1>
            <p class="text-xs tracking-widest uppercase text-adaptive-muted mt-2">Masukkan email untuk memulihkan akses
            </p>
        </div>

        <form method="POST" action="/forgot_password" class="space-y-5">
            <div>
                <label class="block text-[10px] font-black tracking-[0.2em] uppercase text-adaptive-muted mb-2">Alamat
                    Email</label>
                <input type="email" name="email" required
                    class="w-full bg-black/5 dark:bg-black/20 light-theme:bg-black/5 border border-white/10 dark:border-white/10 light-theme:border-black/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-current transition-colors duration-300 font-light text-current">
            </div>
            <div class="pt-2">
                <button type="submit"
                    class="w-full bg-zinc-950 text-white dark:bg-white dark:text-black light-theme:bg-zinc-950 light-theme:text-white font-black text-xs tracking-widest uppercase py-4 rounded-xl shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all duration-200">
                    Kirim Link Reset
                </button>
            </div>
        </form>
        <div class="mt-6 text-center">
            <a href="{{ url_for('auth.login') }}"
                class="text-[10px] font-bold uppercase tracking-widest text-adaptive-muted hover:text-current transition-colors">Kembali
                ke Login</a>
        </div>
    </div>
</div>
<script>
    window.addEventListener('DOMContentLoaded', () => { gsap.from('.form-card', { opacity: 0, y: 20, duration: 1, ease: "power4.out" }); });
</script>
{% endblock %}
